<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#071421">
  <title>Login Cancelled</title>
  <style>
    :root{--bg:#071421;--panel:#0d2032;--line:#25425c;--text:#eef7ff;--muted:#9ab1c6;--red:#f15b68}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 80% 10%,rgba(241,91,104,.14),transparent 26rem),var(--bg);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif}.card{width:min(520px,100%);padding:30px;border:1px solid var(--line);border-radius:22px;background:var(--panel);text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.3)}.icon{font-size:52px}.card h1{margin:14px 0 8px}.card p{color:var(--muted);line-height:1.6}.btn{display:inline-flex;margin-top:12px;padding:11px 16px;border:1px solid var(--line);border-radius:11px;background:#10283d;color:var(--text);text-decoration:none;font-weight:800}
  </style>
</head>
<body>
  <main class="card">
    <div class="icon">✋</div>
    <h1>Login Cancelled</h1>
    <p>You selected NO. No login action was completed from this page.</p>
    <a class="btn" href="./">Back to Office Tools</a>
  </main>
</body>
</html>
