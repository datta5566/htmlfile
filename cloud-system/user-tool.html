<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#071421">
  <title>DK Office Tool</title>
  <style>
    :root{--bg:#071421;--panel:#0d2032;--line:#25425c;--text:#eef7ff;--muted:#9ab1c6;--green:#35ca8b;--red:#f15b68}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 16px;background:#071421;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50}.brand{display:flex;align-items:center;gap:10px}.brand b{font-size:16px}.brand small{display:block;color:var(--muted);margin-top:2px}.icon{font-size:26px}.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.badge{padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#091b29;color:var(--muted);font-size:11px}.badge.ok{color:#9be4bd;border-color:#276449}.badge.err{color:#ffb6bd;border-color:#8c3d49}.btn{border:1px solid var(--line);border-radius:10px;background:#10283d;color:var(--text);padding:9px 12px;font-weight:800;cursor:pointer;text-decoration:none}.frame-wrap{height:calc(100vh - 68px);background:#fff}iframe{display:block;width:100%;height:100%;border:0;background:#fff}.loading{position:fixed;inset:68px 0 0;z-index:40;display:grid;place-items:center;background:#071421;color:#b9d7e8;font-weight:800}.loading[hidden]{display:none}
    @media(max-width:700px){.top{align-items:flex-start}.actions{justify-content:flex-end}.frame-wrap{height:calc(100vh - 96px)}.badge{max-width:190px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.loading{inset:96px 0 0}}
  </style>
</head>
<body>
  <header class="top">
    <div class="brand"><span class="icon" id="toolIcon">🧰</span><div><b id="toolName">Office Tool</b><small id="toolNote">Open user access · Auto cloud sync</small></div></div>
    <div class="actions"><span class="badge" id="cloudBadge">Cloud: Starting...</span><a class="btn" href="./">All Tools</a></div>
  </header>
  <div class="loading" id="loadingLayer">Opening tool...</div>
  <main class="frame-wrap"><iframe id="toolFrame" title="DK Office Tool"></iframe></main>
  <script src="supabase-config.js"></script>
  <script src="user-tool.js"></script>
</body>
</html>
